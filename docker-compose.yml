services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - journal_db:/data
    environment:
      - DATABASE_URL=sqlite:////data/trading_journal.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    command: sh -c "rm -rf /app/node_modules/.vite && npm run dev -- --host 0.0.0.0 --force"

volumes:
  journal_db:
